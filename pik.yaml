schema: 1
requires:
  - name: docker
  - name: node
    version: 26.0.0
  - name: pnpm
    version: 12.0.0
prompts:
  - name: name
    message: Project name, in kebab-case
    pattern: ^[a-z][a-z0-9-]{0,49}$
    default: "{{dir}}"
  - name: owner
    message: GitHub owner, for README links and code owners
    pattern: ^[A-Za-z0-9-]{1,39}$
    optional: true
replace:
  - from: '"extends": ["config:recommended", "github>opikdev/starters//renovate/baseline"]'
    to: '"extends": ["config:recommended"]'
    files: [renovate.json]
  - from: "## Start your own project\n\nCreate a renamed copy with [pik](https://github.com/opikdev/pik). It downloads this starter's latest release, then sets your project name and GitHub owner:\n\n```sh\npik new spa-react-starter my-app\n```\n\nOr select **Use this template** on GitHub. That copy keeps the name `spa-react-starter` and the owner `opikdev`, so follow `pik.yaml` by hand: swap the `replace` text, delete the `exclude` paths, and run the `setup` commands.\n\n## Usage\n"
    to: "## Usage\n"
    files: [README.md]
  - from: "opikdev/spa-react-starter\ncd spa-react-starter\n"
    to: "{{owner}}/{{name}}\ncd {{name}}\n"
    files: [README.md]
  - from: opikdev/spa-react-starter
    to: "{{owner}}/{{name}}"
    files: [README.md, docs/use-your-own-api.md]
  - from: "@opikdev"
    to: "@{{owner}}"
    files: [.github/CODEOWNERS]
  - from: spa-react-starter
    to: "{{name}}"
    files:
      - package.json
      - compose.yaml
      - .devcontainer/devcontainer.json
exclude:
  - .baseline.sha256
  - .github/workflows/baseline-check.yml
setup:
  - pnpm install
  - pnpm exec biome format --write .
  - pnpm exec playwright install chromium
next:
  - docker compose up --build --wait web
check:
  - pnpm verify
  - pnpm test:e2e
