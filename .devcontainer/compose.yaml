services:
  dev:
    image: node:26
    command: sleep infinity
    working_dir: /workspace
    volumes:
      # Relative to the repo root, because compose.yaml is the first file loaded.
      - .:/workspace
      - dev-node-modules:/workspace/node_modules
    environment:
      API_UPSTREAM: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  dev-node-modules:
